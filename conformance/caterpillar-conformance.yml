domain_standards:
  - id: iso-15143-3
    label: ISO 15143-3 (AEMP 2.0) — Earth-moving machinery, worksite data exchange
    conforms: true
    declared_in: contract
    evidence: >-
      The contract declares the standard in its own routing. The production base
      path is https://services.cat.com/telematics/iso15143 (mirrored at
      https://api.cat.com/telematics/iso15143); GET
      https://services.cat.com/telematics/iso15143/fleet/1 returns HTTP 401
      {"code":"401.006","description":"Missing Authorization header or token
      value"}, i.e. the AEMP-shaped resource exists and is auth-gated rather than
      absent. Cat Digital's developer guide names the endpoint set as Fleet
      Snapshot, Equipment Snapshot and Timeseries (fault code, location, switch
      status, cumulative operating hours, cumulative idle operating hours,
      cumulative fuel used, engine condition, fuel remaining ratio) — the
      ISO 15143-3 / AEMP 2.0 element set.
    why_it_matters: >-
      ISO 15143-3 is the mixed-fleet telematics interchange standard for
      earth-moving machinery. A fleet operator or telematics platform that
      already ingests AEMP 2.0 from other OEMs can read Caterpillar machine data
      with no bespoke connector; one that does not needs a bilateral integration.
      Caterpillar, John Deere, CASE, Trackunit and Cartrack all expose the same
      shape, which is precisely the point of the standard.
    source: https://digital.cat.com/knowledge-hub/articles/iso-15143-3-aemp-20-api-developer-guide
