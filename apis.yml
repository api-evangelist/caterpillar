  date: '2026-09-05'
  note: >-
    Contract discovery per pipeline STEP 0b. No public OpenAPI, GraphQL, AsyncAPI,
    gRPC/Protobuf, WSDL, MCP tools/list or A2A agent card exists. What DOES exist and
    was previously unrecorded: an Apigee API gateway at services.cat.com (mirrored at
    api.cat.com), live ISO 15143-3 (AEMP 2.0) and VisionLink endpoints returning a
    structured 401 envelope, and a PingFederate OAuth 2.0 / OIDC authorization server
    at fedlogin.cat.com serving both /.well-known/openid-configuration and
    /.well-known/oauth-authorization-server at HTTP 200. The documentation host
    digital.cat.com is behind a Cloudflare bot policy that returns 403 to every
    non-browser client, so its pages were read through the search index rather than
    fetched; caterpillar.com and cat.com sit behind an Akamai policy that blanket-403s
    non-browser clients including a control path that cannot exist.
  probes:
    - url: https://fedlogin.cat.com/.well-known/openid-configuration
      status: 200
    - url: https://fedlogin.cat.com/.well-known/oauth-authorization-server
      status: 200
    - url: https://services.cat.com/telematics/iso15143/fleet/1
      status: 401
    - url: https://services.cat.com/catDigital/assetSummary/v1/assets
      status: 401
    - url: https://services.cat.com/catDigital/faultsHistory/v1/faults
      status: 401
    - url: https://api.cat.com/openapi.json
      status: 404
    - url: https://services.cat.com/openapi.json
      status: 404
    - url: https://digital.cat.com/api-catalog-overview
      status: 403
    - url: https://www.caterpillar.com/.well-known/agent-card.json
      status: 403
    - url: https://hackerone.com/caterpillar
