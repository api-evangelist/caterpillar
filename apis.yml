description: >-
  Caterpillar Inc. (NYSE: CAT) is the world's leading manufacturer of
  construction and mining equipment, off-highway diesel and natural gas
  engines, industrial gas turbines, and diesel-electric locomotives. Its
  digital arm, Cat Digital, publishes developer APIs through the Cat Digital
  Marketplace (digital.cat.com) covering fleet, asset, fuel, and worksite
  telematics built on top of the Cat Connect and VisionLink data platforms.
  The callable surface runs on an Apigee gateway at services.cat.com (mirrored
  at api.cat.com) and is authorized by a PingFederate OAuth 2.0 / OpenID
  Connect authorization server at fedlogin.cat.com. Caterpillar implements the
  ISO 15143-3 (AEMP 2.0) mixed-fleet telematics standard, so a consumer that
  already speaks AEMP can read Cat machine data with no bespoke connector.
apis:
  - aid: caterpillar:cat-digital-marketplace-api
    name: Cat Digital Marketplace API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/caterpillar.png
    tags:
      - Assets
      - Construction
      - Heavy Equipment
      - Telematics
      - VisionLink
    humanURL: https://digital.cat.com/api-catalog-overview
    baseURL: https://services.cat.com
    properties:
      - url: https://digital.cat.com/api-catalog-overview
        type: Documentation
      - url: https://digital.cat.com/
        type: Portal
      - url: https://digital.cat.com/knowledge-hub/documentation/develop-cat-apis-getting-started
        type: GettingStarted
      - url: https://digital.cat.com/development-guidelines
        type: APIReference
      - url: https://digital.cat.com/release-notes-manager
        type: ChangeLog
      - url: https://digital.cat.com/legal
        type: TermsOfService
      - url: https://digital.cat.com/privacy
        type: PrivacyPolicy
    description: >-
      The Cat Digital Marketplace publishes a catalog of Caterpillar APIs
      spanning asset telematics, fleet management, fuel data, utilization,
      hours/odometer, and geofencing. Developers subscribe via the Cat
      Digital portal to receive API credentials and execute calls against
      the Cat Connect and VisionLink platforms. All catalog APIs are fronted
      by the Apigee gateway at services.cat.com, which returns a uniform
      {code, description} JSON error envelope.
  - aid: caterpillar:iso-15143-3-aemp-api
    name: ISO 15143-3 (AEMP 2.0) API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/caterpillar.png
    tags:
      - Telematics
      - Fleet Management
      - ISO 15143-3
      - AEMP
      - Heavy Equipment
      - Standards
    humanURL: https://digital.cat.com/apis/products/prod/iso-15143-3-aemp-20-api
    baseURL: https://services.cat.com/telematics/iso15143
    properties:
      - url: https://digital.cat.com/knowledge-hub/articles/iso-15143-3-aemp-20-api-developer-guide
        type: Documentation
      - url: https://digital.cat.com/knowledge-hub/faq/iso-15143-3-aemp-20-api-faqs
        type: Support
      - url: https://digital.cat.com/knowledge-hub/document/iso-15143-3-aemp-20-api-postman-collection
        type: Postman
    description: >-
      Caterpillar's implementation of the ISO 15143-3 (AEMP 2.0) mixed-fleet
      telematics standard. Publishes Fleet Snapshot (/fleet/{pageNumber}),
      Equipment Snapshot (/equipment/{equipmentId}) and Timeseries endpoints
      (fault code, location, switch status, cumulative operating hours,
      cumulative idle hours, cumulative fuel used, engine condition, fuel
      remaining ratio) so a consumer that already speaks AEMP can ingest Cat
      machine data alongside other OEM fleets without a bespoke connector.
      Mirrored at https://api.cat.com/telematics/iso15143.
  - aid: caterpillar:visionlink-apis
    name: VisionLink APIs
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/caterpillar.png
    tags:
      - VisionLink
      - Assets
      - Faults
      - Utilization
      - Geofencing
      - Telematics
    humanURL: https://digital.cat.com/api-catalog-overview
    baseURL: https://services.cat.com/catDigital
    properties:
      - url: https://digital.cat.com/knowledge-hub/document/visionlink-apis-postman-collection
        type: Postman
      - url: https://digital.cat.com/api-catalog-overview
        type: Documentation
    description: >-
      The next-generation VisionLink APIs let dealers and customers pull the
      fleet data VisionLink reports without mining it out of the application —
      Assets Operation, Assets Summary, Faults History, Asset Fence History and
      Utilization. They replace the legacy VisionLink APIs and are available in
      the production environment only (no sandbox). Verified live surfaces
      include /assetSummary/v1/assets and /faultsHistory/v1/faults.
